# Controladores da célula (conveyor_cell). Cópia de
# hand_pack/config/cr10_covvi_controllers.yaml com a MÃO em effort + PID:
# com `position` o gazebo_ros2_control teleporta a junta (SetPosition) e o dedo
# atravessa o objeto — ejeta ou explode o ODE. Em effort o contato freia o
# dedo e a força de aperto fica limitada pelo <limit effort> da junta.
# update_rate 1000 = passo do ODE (PID estável nas falanges leves).
controller_manager:
  ros__parameters:
    update_rate: 1000

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    cr10_group_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    hand_position_controller:
      type: joint_trajectory_controller/JointTrajectoryController

cr10_group_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    open_loop_control: true

hand_position_controller:
  ros__parameters:
    joints:
      - Thumb
      - Index
      - Middle
      - Ring
      - Little
      - Rotate
      - _lisa_j01
      - _thumb_chassis_j01
      - _thumb_proximal_j01
      - _thumb_distal_j01
      - _thumb_link_j01
      - _thumb_follower_j01
      - _index_proximal_j01
      - _index_distal_j01
      - _index_knuckle_j01
      - _index_follower_j01
      - _index_link_j01
      - _middle_proximal_j01
      - _middle_distal_j01
      - _middle_knuckle_j01
      - _middle_follower_j01
      - _middle_link_j01
      - _ring_proximal_j01
      - _ring_distal_j01
      - _ring_knuckle_j01
      - _ring_follower_j01
      - _ring_link_j01
      - _little_proximal_j01
      - _little_distal_j01
      - _little_knuckle_j01
      - _little_follower_j01
      - _little_link_j01
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity
    open_loop_control: false
    allow_partial_joints_goal: true
    interpolation_method: splines
    constraints:
      # 0 = não checa. Dedo apertando o objeto nunca para exatamente; com
      # 0.01 + goal_time 0 o goal da mão nunca terminava (executor travado).
      stopped_velocity_tolerance: 0.0
      goal_time: 0.0
    # Drivers (6 primeiras, elos virtuais I=1e-5): p=1/d=0.005. Falanges
    # (mimics, I~1e-4): p=3/d=0.03 → torque satura no <limit effort>=1 N·m
    # com ~0.33 rad de erro (= força máxima de aperto).
    gains:
        Thumb: {p: 1.0, d: 0.005, i: 0.0, i_clamp: 0.0}
        Index: {p: 1.0, d: 0.005, i: 0.0, i_clamp: 0.0}
        Middle: {p: 1.0, d: 0.005, i: 0.0, i_clamp: 0.0}
        Ring: {p: 1.0, d: 0.005, i: 0.0, i_clamp: 0.0}
        Little: {p: 1.0, d: 0.005, i: 0.0, i_clamp: 0.0}
        Rotate: {p: 1.0, d: 0.005, i: 0.0, i_clamp: 0.0}
        _lisa_j01: {p: 3.0, d: 0.03, i: 0.0, i_clamp: 0.0}
        _thumb_chassis_j01: {p: 3.0, d: 0.03, i: 0.0, i_clamp: 0.0}
        _thumb_proximal_j01: {p: 3.0, d: 0.03, i: 0.0, i_clamp: 0.0}
        _thumb_distal_j01: {p: 3.0, d: 0.03, i: 0.0, i_clamp: 0.0}
        _thumb_link_j01: {p: 3.0, d: 0.03, i: 0.0, i_clamp: 0.0}
        _thumb_follower_j01: {p: 3.0, d: 0.03, i: 0.0, i_clamp: 0.0}
        _index_proximal_j01: {p: 3.0, d: 0.03, i: 0.0, i_clamp: 0.0}
        _index_distal_j01: {p: 3.0, d: 0.03, i: 0.0, i_clamp: 0.0}
        _index_knuckle_j01: {p: 3.0, d: 0.03, i: 0.0, i_clamp: 0.0}
        _index_follower_j01: {p: 3.0, d: 0.03, i: 0.0, i_clamp: 0.0}
        _index_link_j01: {p: 3.0, d: 0.03, i: 0.0, i_clamp: 0.0}
        _middle_proximal_j01: {p: 3.0, d: 0.03, i: 0.0, i_clamp: 0.0}
        _middle_distal_j01: {p: 3.0, d: 0.03, i: 0.0, i_clamp: 0.0}

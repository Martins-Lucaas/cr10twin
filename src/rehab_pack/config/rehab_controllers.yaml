# rehab_controllers.yaml — ros2_control do mastro de reabilitação (CR10 + FA7155).
# Só o necessário para abrir a célula: estados das juntas e o JTC do braço.
# O controle de admitância vem depois e não depende deste arquivo.

controller_manager:
  ros__parameters:
    update_rate: 250   # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    cr10_group_controller:
      type: joint_trajectory_controller/JointTrajectoryController

cr10_group_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    command_interfaces:  [position]
    state_interfaces:    [position, velocity]
    state_publish_rate:  100.0
    action_monitor_rate: 50.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 1.5

<svg width="720" height="430" viewBox="0 0 720 430" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ahb" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="11" refY="6" orient="auto"><path d="M0,0 L13,6 L0,12 Z" fill="#2E7CC4"/></marker>
    <marker id="ahg" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="11" refY="6" orient="auto"><path d="M0,0 L13,6 L0,12 Z" fill="#3C9D54"/></marker>
  </defs>
  <rect x="0" y="0" width="720" height="430" fill="#FFFFFF"/>
  <text x="360" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1A1A1A">Bidirectional bridge: who commands whom</text>

  <!-- Digital twin box -->
  <rect x="30" y="74" width="250" height="112" rx="10" fill="#E6F1FB" stroke="#2E7CC4" stroke-width="2"/>
  <text x="155" y="108" text-anchor="middle" font-size="16" font-weight="700" fill="#0C447C">Digital twin</text>
  <text x="155" y="132" text-anchor="middle" font-size="12" fill="#2E6BA8">Gazebo · RViz · GUI</text>
  <text x="155" y="152" text-anchor="middle" font-size="12" fill="#2E6BA8">manual controller · teach pendant</text>
  <text x="155" y="172" text-anchor="middle" font-size="12" fill="#2E6BA8">autonomous executor</text>

  <!-- Physical box -->
  <rect x="440" y="74" width="250" height="112" rx="10" fill="#E4F3E7" stroke="#3C9D54" stroke-width="2"/>
  <text x="565" y="108" text-anchor="middle" font-size="16" font-weight="700" fill="#1E5B2E">Physical CR10A + COVVI</text>
  <text x="565" y="132" text-anchor="middle" font-size="12" fill="#2E7D45">6-DoF collaborative arm</text>
  <text x="565" y="152" text-anchor="middle" font-size="12" fill="#2E7D45">multi-articulated hand</text>
  <text x="565" y="172" text-anchor="middle" font-size="12" fill="#2E7D45">(real hardware)</text>

  <!-- Sim-to-Real arrow (top) -->
  <text x="360" y="104" text-anchor="middle" font-size="12" font-weight="700" fill="#2E7CC4">Sim-to-Real</text>
  <line x1="290" y1="124" x2="428" y2="124" stroke="#2E7CC4" stroke-width="3.5" marker-end="url(#ahb)"/>

  <!-- Real-to-Sim arrow (bottom) -->
  <line x1="430" y1="150" x2="292" y2="150" stroke="#3C9D54" stroke-width="3.5" marker-end="url(#ahg)"/>
  <text x="360" y="174" text-anchor="middle" font-size="12" font-weight="700" fill="#3C9D54">Real-to-Sim</text>

  <!-- Sim-to-Real caption -->
  <rect x="30" y="206" width="660" height="72" rx="8" fill="#F4F9FE" stroke="#BFD9F0" stroke-width="1"/>
  <circle cx="50" cy="228" r="9" fill="#2E7CC4"/><text x="50" y="232" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text>
  <text x="68" y="232" font-size="13" font-weight="700" fill="#0C447C">Sim-to-Real — the simulator commands; the physical set replicates.</text>
  <text x="68" y="252" font-size="11.5" fill="#4A5568">The same trajectory goal drives the virtual model and the real device at the same instant.</text>
  <text x="68" y="270" font-size="11.5" fill="#4A5568">Arm: ServoJ streaming at 33 Hz (continuous) · MovJ with 80 ms debounce (jog) · hand via ECI.</text>

  <!-- Real-to-Sim caption -->
  <rect x="30" y="286" width="660" height="72" rx="8" fill="#F3FAF4" stroke="#C3E3C9" stroke-width="1"/>
  <circle cx="50" cy="308" r="9" fill="#3C9D54"/><text x="50" y="312" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text>
  <text x="68" y="312" font-size="13" font-weight="700" fill="#1E5B2E">Real-to-Sim — the physical arm commands; the twin replicates.</text>
  <text x="68" y="332" font-size="11.5" fill="#4A5568">Joint feedback read at 125 Hz and republished on the joint-state topic.</text>
  <text x="68" y="350" font-size="11.5" fill="#4A5568">Hardware authority · enables drag-teach with the controller in REMOTE mode.</text>

  <!-- Footer -->
  <rect x="30" y="366" width="660" height="56" rx="8" fill="#FBF3E0" stroke="#E0A93B" stroke-width="1.2"/>
  <text x="44" y="388" font-size="11.5" fill="#7A5B12">On the arm the two directions are <tspan font-weight="700">mutually exclusive</tspan> — one direction at a time, selected by mode.</text>
  <text x="44" y="408" font-size="11.5" fill="#7A5B12">What defines the full digital twin is the <tspan font-weight="700">coexistence of both channels</tspan>, not their simultaneity.</text>
</svg>

<svg width="720" height="380" viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ah" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="10" refY="5.5" orient="auto"><path d="M0,0 L12,5.5 L0,11 Z" fill="#3C9D54"/></marker>
    <marker id="aho" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" refX="10" refY="5.5" orient="auto"><path d="M0,0 L12,5.5 L0,11 Z" fill="#B08328"/></marker>
  </defs>
  <rect x="0" y="0" width="720" height="380" fill="#FFFFFF"/>
  <text x="360" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1A1A1A">Start-up synchronization: the twin begins from the real posture</text>
  <text x="360" y="50" text-anchor="middle" font-size="12" font-style="italic" fill="#3C9D54">automatic Real-to-Sim initialization (~3 s)</text>

  <!-- Step 1 -->
  <rect x="34" y="78" width="188" height="88" rx="10" fill="#EFF3F6" stroke="#8AA0AE" stroke-width="1.6"/>
  <text x="128" y="112" text-anchor="middle" font-size="13.5" font-weight="700" fill="#33414A">System start</text>
  <text x="128" y="133" text-anchor="middle" font-size="11" fill="#5A6B75">platform launch</text>
  <text x="128" y="150" text-anchor="middle" font-size="11" fill="#5A6B75">(ROS 2 + Gazebo)</text>

  <!-- Step 2 -->
  <rect x="266" y="78" width="188" height="88" rx="10" fill="#E4F3E7" stroke="#3C9D54" stroke-width="1.8"/>
  <text x="360" y="106" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1E5B2E">Read real pose</text>
  <text x="360" y="127" text-anchor="middle" font-size="11" fill="#2E7D45">CR10 via TCP/IP</text>
  <text x="360" y="144" text-anchor="middle" font-size="11" fill="#2E7D45">(read-only)</text>

  <!-- Step 3 -->
  <rect x="498" y="78" width="188" height="88" rx="10" fill="#E4F3E7" stroke="#3C9D54" stroke-width="1.8"/>
  <text x="592" y="106" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1E5B2E">Drive the model</text>
  <text x="592" y="127" text-anchor="middle" font-size="11" fill="#2E7D45">to the real pose</text>
  <text x="592" y="144" text-anchor="middle" font-size="10.5" fill="#2E7D45">FollowJointTrajectory (~3 s)</text>

  <line x1="224" y1="122" x2="262" y2="122" stroke="#3C9D54" stroke-width="4" marker-end="url(#ah)"/>
  <line x1="456" y1="122" x2="494" y2="122" stroke="#3C9D54" stroke-width="4" marker-end="url(#ah)"/>

  <!-- Result -->
  <line x1="592" y1="168" x2="592" y2="204" stroke="#3C9D54" stroke-width="4" marker-end="url(#ah)"/>
  <rect x="366" y="208" width="320" height="60" rx="10" fill="#DFF0E4" stroke="#2E7D45" stroke-width="2"/>
  <text x="526" y="234" text-anchor="middle" font-size="13.5" font-weight="700" fill="#155026">Twin synchronized to reality</text>
  <text x="526" y="254" text-anchor="middle" font-size="11" fill="#2E7D45">starts from the real posture, not an arbitrary URDF pose</text>

  <!-- Fallback branch -->
  <line x1="360" y1="166" x2="360" y2="300" stroke="#B08328" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="34" y="292" width="300" height="66" rx="10" fill="#FBF3E0" stroke="#E0A93B" stroke-width="1.4"/>
  <text x="50" y="314" font-size="12" font-weight="700" fill="#7A5B12">Robot off / unreachable</text>
  <text x="50" y="333" font-size="11" fill="#7A5B12">keeps the default URDF pose</text>
  <text x="50" y="350" font-size="11" fill="#7A5B12">without blocking start-up</text>
  <line x1="360" y1="325" x2="338" y2="325" stroke="#B08328" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#aho)"/>
  <text x="372" y="290" font-size="10.5" font-style="italic" fill="#B08328">otherwise</text>
</svg>

name: ci

on:
  push:
    branches: [main]         # nas outras branches quem roda é o pull_request
    paths-ignore: ['sensors/Data/**', 'Docs/**', 'docs/**', 'graphify-out/**', '**.md']
  pull_request:

# Um build por ref: um push novo cancela o anterior ainda rodando.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-22.04
    container:
      image: ros:humble-ros-base
    env:
      MPLBACKEND: Agg          # matplotlib sem display
      ROS_DOMAIN_ID: "42"
      DEBIAN_FRONTEND: noninteractive

    steps:
      # git precisa existir ANTES do checkout p/ o clone dos submódulos.
      - name: Ferramentas de build
        shell: bash
        run: |
          # sem "recomendados" (o rosdep também herda) e sem fsync por arquivo
          echo 'APT::Install-Recommends "false";' > /etc/apt/apt.conf.d/99ci
          echo force-unsafe-io > /etc/dpkg/dpkg.cfg.d/99ci
          apt-get update
          apt-get install -y --no-install-recommends \
            git python3-pip python3-colcon-common-extensions python3-rosdep \
            xvfb xauth

      - name: Checkout (com submódulos — src/eci_ros)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: pip — numpy<2 é obrigatório (ABI do cv_bridge do Humble)
        run: pip install --no-cache-dir "numpy<2" pyserial matplotlib trimesh scipy pandas pillow

      - name: rosdep — resolve o que os package.xml declaram
        shell: bash
        run: |
          rosdep init 2>/dev/null || true
          rosdep update
          # uma chamada só do apt; o rosdep faz uma por pacote. A 2ª linha pega o resto.
          apt-get install -y $(rosdep install --from-paths src --ignore-src -r --simulate 2>/dev/null             | sed -n 's/.*apt-get install\( -y\)\? //p' | tr '
' ' ')
          rosdep install --from-paths src --ignore-src -r -y

      # covvi_interfaces é o submódulo: leva ~3 min e quase nunca muda.
      - name: cache do covvi_interfaces
        id: covvi
        uses: actions/cache@v4
        with:
          path: .covvi/install
          key: covvi-humble-${{ hashFiles('src/eci_ros/**/*.msg', 'src/eci_ros/**/*.srv', 'src/eci_ros/**/CMakeLists.txt', 'src/eci_ros/**/package.xml') }}

      - name: covvi_interfaces (só sem cache)
        if: steps.covvi.outputs.cache-hit != 'true'
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon --log-base .covvi/log build --base-paths src/eci_ros --packages-select covvi_interfaces             --build-base .covvi/build --install-base .covvi/install
          touch .covvi/COLCON_IGNORE

      - name: colcon build
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source .covvi/install/setup.bash
          colcon build --symlink-install --packages-skip covvi_interfaces

      # touch_pack: só os testes puros (sem nó) e a trava. test_vtk_render derruba
      # o processo sem display: fica fora. Os demais
      # continuam no repo (src/touch_pack/test/) e rodam à mão.
      - name: smoke tests
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          python3 -m pytest -q -rs \
            src/touch_pack/test/test_controller_config.py \
            src/touch_pack/test/test_explorer_split.py \
            src/touch_pack/test/test_ft_charts.py \
            src/touch_pack/test/test_ft_frame.py \
            src/touch_pack/test/test_ft_hkvl56.py \
            src/touch_pack/test/test_ft_modbus.py \
            src/touch_pack/test/test_ft_polled.py \
            src/touch_pack/test/test_ft_stats.py \
            src/touch_pack/test/test_ft_tcp.py \
            src/touch_pack/test/test_gui_split.py \
            src/touch_pack/test/test_hand_camera_teleop.py \
            src/touch_pack/test/test_hand_connect_ready.py \
            src/touch_pack/test/test_imu_math.py \
            src/touch_pack/test/test_imu_recorder.py \
            src/touch_pack/test/test_kinematics.py \
            src/touch_pack/test/test_manip3d.py \
            src/touch_pack/test/test_pack_lock.py \
            src/touch_pack/test/test_palp_char.py \
            src/touch_pack/test/test_plane_probe.py \
            src/touch_pack/test/test_real_driver_proto.py \
            src/touch_pack/test/test_slide_force_loop.py \
            src/touch_pack/test/test_tcp_calib.py \
            src/touch_pack/test/test_tool_select.py \
            src/touch_pack/test/test_touch_sensor_spec.py

      # rehab_pack inteiro: segura uma pessoa. O Xvfb é para o painel Tk.
      - name: rehab_pack
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          xvfb-run -a python3 -m pytest -q -rs src/rehab_pack/test

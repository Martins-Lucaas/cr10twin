name: ci

on:
  push:
  pull_request:

# Um build por ref: um push novo cancela o anterior ainda rodando.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-22.04
    container:
      image: ros:humble-ros-base
    env:
      MPLBACKEND: Agg          # matplotlib sem display
      ROS_DOMAIN_ID: "42"
      DEBIAN_FRONTEND: noninteractive

    steps:
      # git precisa existir ANTES do checkout p/ o clone dos submódulos.
      - name: Ferramentas de build
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git python3-pip python3-colcon-common-extensions python3-rosdep

      - name: Checkout (com submódulos — src/eci_ros)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: pip — numpy<2 é obrigatório (ABI do cv_bridge do Humble)
        run: pip install --no-cache-dir "numpy<2" pyserial matplotlib

      - name: rosdep — resolve o que os package.xml declaram
        shell: bash
        run: |
          rosdep init 2>/dev/null || true
          rosdep update
          rosdep install --from-paths src --ignore-src -r -y

      - name: colcon build
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --symlink-install --event-handlers console_direct+

      # Smoke básico: só o núcleo puro (câmera + cinemática). Os demais
      # testes continuam no repo (src/touch_pack/test/) e podem ser rodados
      # à mão com `colcon test` — não travam o CI.
      - name: smoke tests
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          python3 -m pytest -q \
            src/touch_pack/test/test_hand_camera_teleop.py \
            src/touch_pack/test/test_kinematics.py

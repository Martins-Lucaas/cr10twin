; Placa: Seeed Studio XIAO ESP32S3.
; O manifesto da placa já define ARDUINO_USB_MODE=1 e ARDUINO_USB_CDC_ON_BOOT=1.
; upload/monitor usam o caminho /dev/serial/by-id (o /dev/ttyACMx muda a cada
; replug). Se a gravação USB não iniciar: segure BOOT, toque RESET, solte BOOT.
;
; 27/07/2026: o firmware é SERIAL-ONLY (o rádio saiu — ver o cabeçalho do
; main.cpp). Com isso a antena externa U.FL deixou de ser obrigatória e o
; ambiente [env:ota] SAIU: sem WiFi não há gravação pelo ar, toda gravação é
; por USB. O cabo já é obrigatório para operar, então não se perde nada.

; Gravação por USB: pio run -t upload
[platformio]
default_envs = seeed_xiao_esp32s3

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
lib_deps = bogde/HX711@^0.7.5
upload_port = /dev/ttyACM0
monitor_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_CC:BA:97:15:45:34-if00
monitor_speed = 115200

; Teste de FIAÇÃO da célula (counts crus, sem o zero de boot):
;   pio run -e serial_test -t upload && pio device monitor
[env:serial_test]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
build_flags = -DSERIAL_TEST=1
lib_deps = bogde/HX711@^0.7.5
upload_port = /dev/ttyACM0
monitor_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_CC:BA:97:15:45:34-if00
monitor_speed = 115200

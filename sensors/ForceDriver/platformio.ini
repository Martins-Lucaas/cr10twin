; Placa: Seeed Studio XIAO ESP32C6.
; upload/monitor usam o caminho /dev/serial/by-id (o /dev/ttyACMx muda a cada
; replug). Se a gravação USB não iniciar: segure BOOT, toque RESET, solte BOOT.
;
; O firmware é SERIAL-ONLY (o rádio saiu — ver o cabeçalho do main.cpp). Sem
; WiFi não há gravação pelo ar: toda gravação é por USB. O cabo já é
; obrigatório para operar, então não se perde nada.
;
; 28/08/2026: migrado do XIAO ESP32S3 para o XIAO ESP32C6 (RISC-V). O platform
; OFICIAL `espressif32` do PlatformIO está preso ao Arduino core 2.0.17, que
; NÃO conhece o C6 — seu board json lá só declara `espidf`. Por isso o platform
; aponta para o fork pioarduino, que empacota o Arduino core 3.x. Não troque de
; volta para `platform = espressif32` sem antes conferir se o core oficial
; passou a suportar C6, senão a build quebra em "unknown board".

; Gravação por USB: pio run -t upload
[platformio]
default_envs = seeed_xiao_esp32c6

[env:seeed_xiao_esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
lib_deps = bogde/HX711@^0.7.5
; ARDUINO_USB_MODE=1 mantém o USB Serial/JTAG do próprio chip (VID 0x303A da
; Espressif), que é o VID que o `LC_USB_VIDS` do constants.py autodetecta.
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
; upload_port pelo by-id, e não por /dev/ttyACMx, PELO MESMO MOTIVO do
; monitor_port logo abaixo: a numeração muda a cada replug. Em 28/08/2026
; este campo apontava para /dev/ttyACM0, que nesta bancada é o ST-Link de um
; STM32 (VID 0483) e não o XIAO (VID 303A) — gravar por ele nunca acertaria a
; placa certa. O caminho abaixo é do próprio chip e não depende da ordem de
; enumeração.
upload_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_10:BD:A3:9C:B0:84-if00
monitor_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_10:BD:A3:9C:B0:84-if00
monitor_speed = 115200
